<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roteirista">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0C0E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Roteirista de Bolso</title>
<style>
:root{
  --bg:#0B0C0E; --surface:#15171A; --surface-2:#1E2125; --surface-3:#272B30; --ink:#F4F4F2; --muted:#9A9C9F; --dim:#62656A;
  --line:#24272B; --line-strong:#33373C;
  --gold:#F5A623; --gold-ink:#1A1204; --gold-soft:rgba(245,166,35,.13);
  --teal:#3FB3B3; --teal-deep:#1B7272; --teal-soft:rgba(63,179,179,.14);
  --rec:#FF5A4E; --rec-soft:rgba(255,90,78,.14);
  --ok:#7FD48A; --ok-soft:rgba(127,212,138,.13);
  --warn:#F4D35E; --warn-soft:rgba(244,211,94,.12);
  --scrim:rgba(0,0,0,.62);
  --radius:22px; --radius-s:16px; --tabbar:66px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:340px;pointer-events:none;z-index:0;
  background:radial-gradient(120% 90% at 50% -10%,rgba(27,114,114,.40),rgba(27,114,114,.08) 55%,transparent 75%)}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
[hidden]{display:none!important}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:12px} .center{text-align:center}
.num{font-variant-numeric:tabular-nums}
main{position:relative;z-index:1;max-width:620px;margin:0 auto;
  padding-top:calc(env(safe-area-inset-top, 0px) + 12px);
  padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 34px);
  padding-left:16px;padding-right:16px;display:flex;flex-direction:column;gap:16px}
h1{font-size:26px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.02em}
h2{font-size:18px;line-height:1.25;margin:0;font-weight:650;letter-spacing:-.01em}
h3{font-size:15px;margin:0;font-weight:650}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{appearance:none;border:0;font-weight:650;font-size:16px;border-radius:999px;padding:12px 18px;min-height:48px;
  background:var(--surface-2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2}
.btn.primary{background:var(--gold);color:var(--gold-ink)}
.btn.teal{background:var(--teal-deep);color:#fff}
.btn.danger{background:transparent;color:var(--rec);border:1px solid rgba(255,90,78,.4)}
.btn.ghost{background:transparent;color:var(--gold);padding-left:6px;padding-right:6px}
.btn.block{width:100%}
.btn.small{min-height:40px;padding:8px 14px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.icon-btn:focus-visible,.row-btn:focus-visible,.tabbar button:focus-visible,.mic:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.linkish{appearance:none;border:0;background:none;padding:0;color:var(--gold);font-weight:600;text-align:left;cursor:pointer;text-decoration:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card.tight{padding:12px 14px}
.card.warn{background:var(--warn-soft);border-color:rgba(244,211,94,.25)}
.card.bad{background:var(--rec-soft);border-color:rgba(255,90,78,.3)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.list>li+li{border-top:1px solid var(--line)}
.row-btn{appearance:none;border:0;background:transparent;width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;min-height:64px;color:inherit}
.rb-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rb-main b{font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.rb-main span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:22px 18px;text-align:center;border:1.5px dashed var(--line-strong);border-radius:var(--radius);color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);max-width:100%;line-height:1.3;white-space:nowrap}
.chip>span{overflow:hidden;text-overflow:ellipsis}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--rec-soft);color:var(--rec)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.gold{background:var(--gold-soft);color:var(--gold)} .chip.teal{background:var(--teal-soft);color:var(--teal)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--dim)}
.dot.live{background:var(--gold);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* gravador */
.recorder{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 16px 20px;text-align:center}
.mic{appearance:none;border:0;width:148px;height:148px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 0 0 10px var(--gold-soft),0 12px 40px rgba(245,166,35,.25);transition:transform .15s}
.mic:active{transform:scale(.96)}
.mic svg{width:58px;height:58px}
.rec-live{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.rec-time{font-size:44px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rec-time .d{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--rec);margin-right:10px;vertical-align:middle;animation:pulse 1s infinite}
.bars{display:flex;align-items:center;justify-content:center;gap:3px;height:56px;width:100%;max-width:320px}
.bars i{flex:1;max-width:6px;background:var(--gold);border-radius:3px;height:6%;transition:height .08s}
.rec-actions{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:4px}
.round{appearance:none;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.round.big{width:84px;height:84px;background:var(--gold);color:var(--gold-ink)}
.round.mid{width:60px;height:60px;background:var(--surface-2);color:var(--ink)}
.round svg{width:30px;height:30px}
.hint{font-size:14px;color:var(--muted);max-width:340px}
.alt-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* progresso */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;align-items:center;gap:12px;padding:8px 2px;color:var(--dim)}
.steps li .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid var(--line-strong);font-size:13px;font-weight:700}
.steps li.done{color:var(--muted)} .steps li.done .ic{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}
.steps li.now{color:var(--ink);font-weight:600} .steps li.now .ic{border-color:var(--gold);color:var(--gold)}
.steps li.now .ic::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold);animation:pulse 1.2s infinite}
.steps li .t{margin-left:auto;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}

/* roteiro */
.script{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px}
.script h2{font-size:20px;text-align:center;background:var(--gold);color:var(--gold-ink);padding:10px 12px;border-radius:12px;margin-bottom:14px;line-height:1.25}
.script p{margin:0 0 14px;font-size:17px;line-height:1.5}
.script p:last-child{margin-bottom:0}
.script b{color:#fff;font-weight:700}
.script .ref{color:var(--muted);font-size:13px}
.kv{display:flex;flex-wrap:wrap;gap:8px}
.ref-card{display:flex;gap:12px;align-items:flex-start}
.ref-card img{width:112px;height:63px;object-fit:cover;border-radius:10px;flex:none;background:var(--surface-2)}
.ref-card .rb-main b{-webkit-line-clamp:3}
details.more{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
details.more summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:14px;list-style:none;padding:4px 0}
details.more summary::-webkit-details-marker{display:none}
.hook-grid{display:flex;flex-direction:column;gap:8px;margin-top:8px;font-size:14.5px}
.hook-grid div b{color:var(--muted);font-weight:600;display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
.quote{white-space:pre-wrap;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--muted);max-height:260px;overflow:auto}
.mapa li{padding:10px 14px;font-size:15px}
.linkrow{display:flex;flex-direction:column;gap:6px}
.linkrow a{color:var(--gold);text-decoration:none;word-break:break-word;font-size:14.5px}

/* formulários */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted);font-weight:600}
.input,textarea.input,select.input{appearance:none;width:100%;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:14px;padding:12px 14px;font-size:16px;color:var(--ink);min-height:48px}
textarea.input{min-height:120px;resize:vertical;line-height:1.45}
.input:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.switch input{width:48px;height:28px;appearance:none;background:var(--surface-3);border-radius:999px;position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked{background:var(--gold)} .switch input:checked::after{transform:translateX(20px)}
ol.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px}
ol.how code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;background:var(--surface-2);padding:1px 6px;border-radius:6px;word-break:break-all}
.lig li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.lig .st{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--muted)}
.lig .st.ok{background:var(--ok-soft);color:var(--ok)} .lig .st.bad{background:var(--rec-soft);color:var(--rec)}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(11,12,14,.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabbar)}
.tabbar button{appearance:none;border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;cursor:pointer;position:relative}
.tabbar button svg{width:25px;height:25px}
.tabbar button[aria-current="page"]{color:var(--gold)}
.tabbar .badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:var(--gold-ink);font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* folha (sheet) e toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:620px;background:var(--surface);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line-strong);margin:0 auto 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 16px);z-index:60;
  background:var(--surface-3);color:var(--ink);padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
.back{appearance:none;border:0;background:none;color:var(--gold);font-weight:600;display:inline-flex;align-items:center;gap:4px;padding:8px 0;cursor:pointer;min-height:44px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabbar" aria-label="Seções"><div class="in" id="tabs"></div></nav>
<div id="layer"></div>
<script>
'use strict';
/* ============================================================================================
   Roteirista de Bolso — PWA
   Grava a ideia → sobe pro repositório privado (audios/ + inbox/) → o robô do GitHub Actions
   transcreve, busca referências, escreve o roteiro, cria Doc e card → grava saida/<id>.json → o app mostra.
   Nenhum dado pessoal neste código: token e repositório ficam só no aparelho.
   ============================================================================================ */
const APP_VERSION = '1.0';
const APP_ID = 'roteirista';
const REPO_PADRAO = 'Jhonatas124/roteirista-dados';
const PREVIEW = /[?&]preview=1/.test(location.search);

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TE = new TextEncoder(), TD = new TextDecoder();
function b64(buf) { const u = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const fmtTime = s => `${pad(Math.floor(s / 60))}:${pad(Math.floor(s % 60))}`;
function fmtDate(iso) { if (!iso) return ''; const d = new Date(iso); const hoje = new Date(); const ontem = new Date(Date.now() - 864e5);
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (d.toDateString() === hoje.toDateString()) return `hoje, ${hm}`;
  if (d.toDateString() === ontem.toDateString()) return `ontem, ${hm}`;
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}, ${hm}`; }
function fmtViews(n) { n = +n || 0; if (n >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',') + ' mi'; if (n >= 1e3) return Math.round(n / 1e3) + ' mil'; return String(n); }
function dur(a, b) { const s = Math.max(0, Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 1000)); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}min ${pad(s % 60)}s` : `${Math.floor(s / 3600)}h${pad(Math.floor(s % 3600 / 60))}`; }
function novoId() { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}-${Math.random().toString(36).slice(2, 6)}`; }
const DIAS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
function fmtPostar(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d); return `${DIAS[dt.getDay()]}, ${pad(d)}/${pad(m)}`; }

/* ---------------- ícones ---------------- */
const I = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.6 21 12 3.4 3.4l-.01 6.7L15 12 3.39 13.9z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  ext: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>'
};

/* ---------------- armazenamento local (IndexedDB) ---------------- */
const DB = {
  db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((res, rej) => { const r = indexedDB.open('roteirista', 1);
    r.onupgradeneeded = () => { const d = r.result; ['saidas', 'pendentes', 'kv'].forEach(n => d.objectStoreNames.contains(n) || d.createObjectStore(n)); };
    r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  async tx(store, mode, fn) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction(store, mode); const s = t.objectStore(store); const out = fn(s); t.oncomplete = () => res(out && 'result' in out ? out.result : out); t.onerror = () => rej(t.error); }); },
  get(store, k) { return this.tx(store, 'readonly', s => s.get(k)); },
  put(store, k, v) { return this.tx(store, 'readwrite', s => s.put(v, k)); },
  del(store, k) { return this.tx(store, 'readwrite', s => s.delete(k)); },

const GH = {

  async req(path, opts = {}) {

function tituloDe(it) { if (!it.titulo && it.pedido && it.pedido.refazer_de) { const o = S.itens.get(it.pedido.refazer_de); return 'Refazendo: ' + (o ? tituloDe(o) : 'roteiro'); } return it.titulo || it.titulo_provisorio || (it.entrada && it.entrada.tema) || (it.pedido && it.pedido.texto && it.pedido.texto.slice(0, 80)) || `Ideia de ${fmtDate(it.criado)}`; }

/* ---------------- envio (com fila offline) ---------------- */
function extDe(mime) { mime = (mime || '').toLowerCase(); if (mime.includes('mp4') || mime.includes('m4a') || mime.includes('aac')) return 'm4a'; if (mime.includes('webm')) return 'webm'; if (mime.includes('ogg') || mime.includes('opus')) return 'ogg'; if (mime.includes('mpeg') || mime.includes('mp3')) return 'mp3'; if (mime.includes('wav')) return 'wav'; if (mime.includes('quicktime')) return 'mov'; return 'm4a'; }
async function novaIdeia({ blob, mime, duracao, texto, origem, nomeArquivo }) {
  const id = novoId();
  const pedido = { app: APP_ID, v: 1, id, criado: new Date().toISOString(), origem, texto: (texto || '').trim(), aparelho: /iPhone/.test(navigator.userAgent) ? 'iPhone' : /Mac/.test(navigator.userAgent) ? 'Mac' : 'navegador' };
  let audioBuf = null;
  if (blob) {
    let ext = extDe(mime || blob.type);

    pedido.audio = `audios/${id}.${ext}`; pedido.duracao_s = duracao ? Math.round(duracao) : undefined;
    audioBuf = await blob.arrayBuffer();
  }
  const p = { id, pedido, audio: audioBuf, tentativas: 0 };
  await DB.put('pendentes', id, p); S.pend.set(id, p);
  render();
  enviarPendentes();

}
let enviando = false;
async function enviarPendentes() {
  if (enviando || !GH.ok() || !navigator.onLine || PREVIEW) return;
  enviando = true;
  try {
    for (const p of [...S.pend.values()]) {
      try {
        if (p.audio && !p.audioOk) { await GH.put(p.pedido.audio, new Uint8Array(p.audio), `Áudio da ideia ${p.id}`); p.audioOk = true; await DB.put('pendentes', p.id, p); }
        await GH.putJSON(`inbox/${p.id}.json`, p.pedido, `Nova ideia ${p.id}`);
        const it = { id: p.id, app: APP_ID, criado: p.pedido.criado, status: 'fila', etapa: 'fila', pedido: p.pedido, etapas: [{ etapa: 'fila', rotulo: 'Na fila', quando: new Date().toISOString() }], _local: true };
        S.itens.set(p.id, it); await DB.put('saidas', p.id, { item: it, sha: '' });
        await DB.del('pendentes', p.id); S.pend.delete(p.id);

      } catch (e) {

}
async function reenviar(it, extra = {}) {

  delete pedido.audio_b64;

  it.status = 'trabalhando'; it.etapa = 'fila'; delete it.erro; S.itens.set(it.id, it); render(); agendar();
}
async function refazer(it, instrucao) {
  const id = novoId();
  const pedido = { app: APP_ID, v: 1, id, criado: new Date().toISOString(), origem: 'refazer', refazer_de: it.id, instrucao: (instrucao || '').trim(), texto: '' };

/* ---------------- sincronização (lê saida/) ---------------- */
let timer = null, syncing = false;
function agendar() { clearTimeout(timer); const rapido = S.pend.size || todos().some(ativo); timer = setTimeout(sync, document.hidden ? 300000 : rapido ? 12000 : 90000); }
async function sync(manual) {
  if (syncing || !GH.ok() || PREVIEW) { agendar(); return; }
  syncing = true;
  let mudou = !!manual;
  try {
    enviarPendentes();
    const files = await GH.list('saida');
    const cache = new Map((await DB.all('saidas')).map(x => [x.item.id, x]));
    for (const f of files) {
      if (f.type !== 'file' || !/\.json$/.test(f.name)) continue;
      if (f.name === '_teste.json') { if (LS.get('testeSha') !== f.sha) { const j = JSON.parse(TD.decode(await GH.raw(f.path))); S.teste = j; LS.set('teste', j); LS.set('testeSha', f.sha); mudou = true; } continue; }
      const id = f.name.replace(/\.json$/, '');
      const c = cache.get(id);
      if (c && c.sha === f.sha) { if (!S.itens.has(id)) { S.itens.set(id, c.item); mudou = true; } continue; }
      const raw = await GH.raw(f.path); if (!raw) continue;
      const item = JSON.parse(TD.decode(raw));
      const antes = S.itens.get(id);
      S.itens.set(id, item); await DB.put('saidas', id, { item, sha: f.sha }); mudou = true;
      if (antes && antes.status !== 'pronto' && item.status === 'pronto') { toast(`Roteiro pronto: ${tituloDe(item)}`); avisar(item); }
    }
    if (S.sync.erro) mudou = true;
    S.sync = { at: Date.now(), erro: '' };
  } catch (e) { const mudouErro = S.sync.erro !== e.message; S.sync = { at: S.sync.at, erro: e.message }; if (mudouErro) mudou = true; if (manual) toast(e.message); }
  finally { syncing = false; if (mudou || manual) render(!manual); agendar(); }
}
async function avisar(item) {
  try { if ('Notification' in window && Notification.permission === 'granted' && document.hidden) { const reg = await navigator.serviceWorker?.getRegistration(); reg?.showNotification('Roteiro pronto', { body: tituloDe(item), icon: 'icon-192.png', tag: item.id }); } } catch (_) {}
}
async function lerConfig() { try { const raw = await GH.raw('config.json'); S.config = raw ? JSON.parse(TD.decode(raw)) : {}; } catch (e) { S.config = S.config || {}; } return S.config; }

/* ---------------- gravador ---------------- */
const Rec = {
  on: false, t0: 0, mr: null, stream: null, chunks: [], ctx: null, an: null, raf: 0, tick: 0, lock: null, mime: '',

  async start() {

    render(); this.loop();

  },
  loop() {

    if (this.an && bars.length) { const d = new Uint8Array(this.an.frequencyBinCount); this.an.getByteTimeDomainData(d); let pk = 0; for (const v of d) pk = Math.max(pk, Math.abs(v - 128)); const lv = Math.min(1, pk / 70);

function render(fundo) {

  const app = $('#app');
  const foco = document.activeElement;
  if (fundo && foco && app.contains(foco) && /^(INPUT|TEXTAREA|SELECT)$/.test(foco.tagName)) return;
  if (fundo && S.tab === 'ajustes' && !S.view) { const l = $('#ligList'); if (l) l.outerHTML = listaLigacoes(); return; }
  const abertos = [...app.querySelectorAll('details')].map(d => d.open);
  const y = window.scrollY;
  desenhar(app);
  const ds = app.querySelectorAll('details');
  if (ds.length === abertos.length) ds.forEach((d, i) => { d.open = abertos[i]; });
  if (fundo) window.scrollTo(0, y);

}

function mdRoteiro(md) {
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<i>$2</i>').replace(/⟨mantido da referência⟩/g, '<span class="ref">⟨mantido da referência⟩</span>');

  return out.join('');
}

  const idx = ETAPAS.findIndex(e => e[0] === it.etapa);
  return `<ol class="steps">${ETAPAS.map(([k, n], i) => { const cls = i < idx || it.status === 'pronto' ? 'done' : i === idx ? 'now' : ''; return `<li class="${cls}"><span class="ic">${cls === 'done' ? '✓' : ''}</span><span>${esc(n)}</span>${feitas.get(k) ? `<span class="t">${new Date(feitas.get(k)).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span>` : ''}</li>`; }).join('')}</ol>`;
}

function criarDoc(titulo, html) {
  const limite = 'roteirista' + Date.now();
  const meta = { name: titulo, mimeType: 'application/vnd.google-apps.document', parents: [PASTA_ID] };
  const corpo = '--' + limite + '\\r\\nContent-Type: application/json; charset=UTF-8\\r\\n\\r\\n' + JSON.stringify(meta) +
    '\\r\\n--' + limite + '\\r\\nContent-Type: text/html; charset=UTF-8\\r\\n\\r\\n' + html + '\\r\\n--' + limite + '--';
  const r = UrlFetchApp.fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method: 'post', contentType: 'multipart/related; boundary=' + limite, payload: Utilities.newBlob(corpo).getBytes(),
    headers: { Authorization: 'Bearer ' + ScriptApp.getOAuthToken() }, muteHttpExceptions: true
  });
  if (r.getResponseCode() >= 300) throw new Error('Drive ' + r.getResponseCode() + ': ' + r.getContentText().slice(0, 300));
  return JSON.parse(r.getContentText()).id;
}

    switch (act) {

      case 'rec-send': Rec.stop(true); break;

      case 'salvar-gh': {
        const repo = $('#fRepo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, ''); const token = $('#fTok').value.trim();
        if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) { toast('Preencha o repositório (dono/nome) e a chave'); return; }
        LS.set('cfg', { repo, token });
        try { const info = await GH.repoInfo(); if (!info.private) toast('Atenção: esse repositório é PÚBLICO'); else toast('Conectado ✓'); S.sync.erro = ''; await lerConfig(); await sync(); render(); } catch (err) { S.sync.erro = err.message; toast(err.message); render(); }
        break;
      }
      case 'testar': { await GH.putJSON(`inbox/teste-${novoId()}.json`, { app: APP_ID, tipo: 'teste', criado: new Date().toISOString() }, 'Testar ligações'); toast('Teste enviado. Resultado em ~1 min.'); agendarTeste(); break; }
      case 'copiar-gs': { await lerConfig(); const cod = codigoAppsScript(); copiar(cod, 'Código copiado — cole no Apps Script'); if (!(S.config && S.config.doc_segredo)) salvarConfig({ doc_segredo: segredoDoc() }, 'Segredo do Google Doc').catch(() => {}); break; }
      case 'salvar-doc': { const u = $('#fDoc').value.trim(); if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(u)) { toast('Cole a URL que termina em /exec'); return; } await salvarConfig({ doc_url: u, doc_segredo: segredoDoc() }, 'Ligar Google Doc'); toast('Salvo. Toque em Testar agora.'); break; }
      case 'salvar-pref': await salvarConfig({ meses_referencia: +$('#fMeses').value, qtd_referencias: +$('#fQtd').value, segundos_hook: +$('#fSeg').value, data_livre: $('#fLivre').checked }, 'Preferências do roteirista'); toast('Preferências salvas'); break;
      case 'notif': { if (!('Notification' in window)) { toast('No iPhone: instale o app na Tela de Início primeiro'); return; } const p = await Notification.requestPermission(); toast(p === 'granted' ? 'Aviso ligado (com o app aberto ou em segundo plano)' : 'Aviso não liberado'); render(); break; }
      case 'update': await checarVersao(true); break;
    }
  } catch (err) { toast(err.message || 'Erro'); }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'fileIn') return;
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (!GH.ok()) { toast('Primeiro ligue o app em Ajustes.'); return; }
  if (f.size > 45 * 1024 * 1024) { toast('Arquivo grande demais (máx. 45 MB). Mande o link do vídeo por texto.'); return; }
  await novaIdeia({ blob: f, mime: f.type, origem: 'arquivo', nomeArquivo: f.name });
});
let testeT = 0;
function agendarTeste(n = 0) { clearTimeout(testeT); if (n > 16) return; testeT = setTimeout(async () => { const antes = LS.get('testeSha'); await sync(); if (LS.get('testeSha') === antes) agendarTeste(n + 1); else toast('Teste das ligações chegou'); }, 10000); }

/* ---------------- atualização automática ---------------- */
function isNewer(a, b) { const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number); for (let i = 0; i < Math.max(pa.length, pb.length); i++) { const x = pa[i] || 0, y = pb[i] || 0; if (x !== y) return x > y; } return false; }
async function checarVersao(manual) {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    if (isNewer(j.version, APP_VERSION)) { if (Rec.on) return; toast(`Atualizando pra versão ${j.version}…`); await atualizarAgora(); }
    else if (manual) toast(`Você já está na versão mais nova (${APP_VERSION})`);
  } catch (e) { if (manual) toast('Sem internet pra procurar atualização'); }
}
async function atualizarAgora() {
  try { if ('serviceWorker' in navigator) { const reg = await navigator.serviceWorker.getRegistration(); if (reg) { try { await reg.update(); } catch (_) {} if (reg.waiting) reg.waiting.postMessage('skip'); } } if (window.caches) { for (const k of await caches.keys()) await caches.delete(k); } } catch (_) {}
  setTimeout(() => location.reload(), 400);
}

/* ---------------- início ---------------- */
async function iniciar() {
  try { for (const x of await DB.all('saidas')) S.itens.set(x.item.id, x.item); for (const p of await DB.all('pendentes')) S.pend.set(p.id, p); } catch (_) {}
  S.teste = LS.get('teste', null);
  render();
  if (GH.ok() && !PREVIEW) { lerConfig().then(() => render(true)); sync(); }
  if (!PREVIEW) { checarVersao(false); setInterval(() => checarVersao(false), 30 * 60 * 1000); }
}
window.addEventListener('online', () => { S.online = true; enviarPendentes(); sync(); });
window.addEventListener('offline', () => { S.online = false; render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); else agendar(); });
if (!PREVIEW && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(() => {});
iniciar();
</script>
